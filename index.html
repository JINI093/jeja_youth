<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제자교회 청년부 6월 14일 순 공과</title>
    <style>
        body {
            background-color: #fbe9e7;
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 1.8rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 85%;
            min-height: 540px;
            display: flex;
            flex-direction: column;
        }
        h1 { color: #d84315; font-size: 1.35rem; margin-bottom: 0.3rem; line-height: 1.4; }
        .subtitle { color: #ff7043; font-size: 0.95rem; margin-bottom: 1.2rem; font-weight: bold; }
        
        .menu-group { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; justify-content: center; }
        .btn {
            padding: 18px;
            border: none;
            border-radius: 12px;
            background-color: #fbe9e7;
            color: #bf360c;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
        }

        #slide-container { display: none; flex-direction: column; height: 100%; text-align: left; }
        #slides { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .slide-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; border-bottom: 2px solid #fbe9e7; padding-bottom: 10px; }
        .slide-step { background: #d84315; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; white-space: nowrap; }
        .slide-title { color: #d84315; font-size: 1.05rem; font-weight: bold; line-height: 1.4; }
        
        .verse-box { background: #fafafa; border: 1px dashed #ccc; padding: 12px; margin-bottom: 15px; font-size: 0.85rem; color: #666; line-height: 1.5; border-radius: 10px; }
        .content-text { font-size: 0.95rem; line-height: 1.7; color: #444; margin-bottom: 12px; }
        .choice-box { background: #fff8e1; border-left: 4px solid #ffb300; padding: 10px 12px; margin-top: 8px; font-size: 0.88rem; color: #5d4037; line-height: 1.5; border-radius: 0 8px 8px 0; }
        
        .controls { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 15px; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .nav-btn { flex: 1; padding: 12px 5px; border: none; border-radius: 8px; background: #f5f5f5; font-weight: bold; cursor: pointer; color: #666; font-size: 0.9rem; }
        .next-btn { background: #ffccbc; color: #bf360c; }
        
        .submit-btn { background: #d84315; color: white; flex: 1.4; } 
        .home-btn { width: 100%; padding: 10px; background: #757575; color: white; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div id="main-menu">
        <h1>👥 6월 14일 순 공과</h1>
        <div class="subtitle">하나님이 받으시는 예배, 내 뜻이라는 다른 불을 끄라</div>
        <div class="verse-box">
            "모세가 아론에게 이르되 이는 여호와의 말씀이라 이르시기를 나는 나를 가까이 하는 자 중에서 내 거룩함을 나타내겠고 온 백성 앞에서 내 영광을 나타내리라 하셨느니라" <br>(레 10:3)
        </div>
        <div class="menu-group">
            <button class="btn" onclick="startSlide()">📖 말씀 소그룹 나눔<br><small style="font-weight:normal; font-size:0.8rem; display:block; margin-top:5px;">순별 나눔 시작하기</small></button>
        </div>
    </div>

    <div id="slide-container">
        <div id="slides"></div>
        <div class="controls">
            <div class="nav-row">
                <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">이전</button>
                <span id="page-num" style="font-size: 0.8rem; color: #888; min-width:40px; text-align:center;"></span>
                <button class="nav-btn next-btn" id="nextBtn" onclick="changeSlide(1)">다음</button>
                <button class="nav-btn submit-btn" id="submitBtn" onclick="finishSlide()">🎉 나눔 완료</button>
            </div>
            <button class="home-btn" onclick="goHome()">🏠 처음으로</button>
        </div>
    </div>
</div>

<script>
    let currentSlide = 0;

    const questions = [
        { 
            chapter: "Q1. 영적 주소 직면", 
            title: "내 안에 도사린 '익숙함이 준 교만' 노출하기", 
            text: "나답과 아비후는 하나님의 영광을 가장 자주 보았던 영적 엘리트였기에 역설적으로 예배를 만만하게 여기는 교만에 빠졌습니다.",
            desc: "모태신앙이거나 신앙생활 연차가 쌓이면서, 혹은 교회 공동체나 리더 자리에 익숙해지면서 나도 모르게 예배를 타성적으로 대하거나 긴장감 없이 앉아 있었던 순간(예: 지각이 당연해짐, 예배 분위기 평가하기 등)이 있었다면 언제인지 솔직하게 나누어 봅시다." 
        },
        { 
            chapter: "Q2. 가치관 점검", 
            title: "내가 드리는 예배의 기준은 '하나님'인가요, '나'인가요?", 
            text: "오늘 설교에서는 내 위로와 내 기쁨, 내 감정적 만족만을 위해 쇼핑하듯 소비하는 예배 태도를 현대판 '다른 불'이라고 고발했습니다.",
            desc: "평소 내가 예배의 성공 여부를 판단할 때, '찬양 콘티가 내 스타일이었는가', '위로가 되는 설교였는가'처럼 은연중에 기준을 '나의 만족'에 두고 있지는 않았는지 하나님의 주권 관점에서 우리 자신을 돌아보고 나누어 봅시다." 
        },
        { 
            chapter: "Q3. 실제적 결단", 
            title: "내 삶에서 '다른 불'을 끄고 '번제단의 불'을 켜는 방법", 
            text: "하나님은 \"나를 가까이하는 자 중에서 내 거룩함을 나타내겠다\"고 말씀하셨습니다. 이번 한 주간, 내 마음대로 인생의 매뉴얼을 요리하려던 교만한 태도(다른 불)를 끄고, 전심으로 하나님이 받으시는 예배자로 서기 위해 '당장 이번 주일부터' 바꿀 나의 구체적인 행동은 무엇인지 결단해 봅시다.",
            choices: [
                "⏰ <b>예시 1:</b> 예배 15분 전에 도착해서 온전히 성령의 도우심과 말씀에 집중할 기도로 준비하기",
                "🌱 <b>예시 2:</b> 주중 삶의 자리(직장, 캠퍼스)에서 내 고집과 이기심을 내려놓는 '삶의 순종(예배)' 훈련하기",
                "📝 <b>예시 3:</b> 예배 중 스마트폰 멀리하고, 설교 노트를 적으며 말씀에 영적으로 주파수 맞추기"
            ]
        }
    ];

    function startSlide() {
        currentSlide = 0;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('slide-container').style.display = 'flex';
        renderSlide();
    }

    function renderSlide() {
        const slidesDiv = document.getElementById('slides');
        const q = questions[currentSlide];
        
        let contentHTML = `<div class="content-text">${q.text}</div>`;
        
        let descHTML = "";
        if (q.desc) {
            descHTML = `<div class="content-text" style="font-weight: bold; color: #bf360c; background: #fff5f5; padding: 15px; border-radius: 10px; line-height: 1.6; border: 1px solid #ffcdd2; margin-top:15px;">${q.desc}</div>`;
        } else if (q.choices) {
            descHTML = `<div style="margin-top: 15px;">`;
            q.choices.forEach(choice => {
                descHTML += `<div class="choice-box">${choice}</div>`;
            });
            descHTML += `</div>`;
        }

        slidesDiv.innerHTML = `
            <div style="animation: fadeIn 0.3s; display: flex; flex-direction: column; height: 100%;">
                <div class="slide-header">
                    <span class="slide-step">${q.chapter}</span>
                    <span class="slide-title">${q.title}</span>
                </div>
                <div style="flex-grow: 1; overflow-y: auto;">
                    ${contentHTML}
                    ${descHTML}
                </div>
            </div>
        `;
        
        document.getElementById('page-num').innerText = `${currentSlide + 1}/${questions.length}`;
        document.getElementById('prevBtn').style.visibility = currentSlide === 0 ? 'hidden' : 'visible';
        
        if (currentSlide === questions.length - 1) {
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('submitBtn').style.display = 'none';
        }
    }

    function changeSlide(direction) {
        currentSlide += direction;
        if (currentSlide >= questions.length) currentSlide = questions.length - 1;
        if (currentSlide < 0) currentSlide = 0;
        renderSlide();
    }

    function finishSlide() {
        alert("오늘 순 공과 나눔을 모두 마쳤습니다. 내 뜻과 기준이라는 다른 불을 끄고, 하나님이 기뻐하시는 온전한 예배자로 승리하는 청년들이 되기를 소망합니다. 함께 기도함으로 모임을 마무리해 주세요! 🙏");
        goHome();
    }

    function goHome() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('slide-container').style.display = 'none';
    }
</script>

</body>
</html>
