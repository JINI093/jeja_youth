<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제자교회 청년부 10월 11일 순 공과</title>
    <style>
        body {
            background: linear-gradient(135deg, #fcf8f2 0%, #f7ebd9 50%, #f5e6d3 100%);
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 1.8rem;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(141, 36, 60, 0.12);
            text-align: center;
            max-width: 450px;
            width: 85%;
            min-height: 540px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        h1 { color: #8d243c; font-size: 1.35rem; margin-bottom: 0.3rem; line-height: 1.4; }
        .subtitle { color: #b71c1c; font-size: 0.95rem; margin-bottom: 1.2rem; font-weight: bold; }
        
        .menu-group { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; justify-content: center; }
        .btn {
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #fbe9e7, #ffccbc);
            color: #5d4037;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(141, 36, 60, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.98); }

        #slide-container { display: none; flex-direction: column; height: 100%; text-align: left; }
        #slides { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .slide-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; border-bottom: 2px solid #fbe9e7; padding-bottom: 10px; }
        .slide-step { background: linear-gradient(135deg, #8d243c, #b71c1c); color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; white-space: nowrap; }
        .slide-title { color: #8d243c; font-size: 1.05rem; font-weight: bold; line-height: 1.4; }
        
        .verse-box { background: #faf4ef; border: 1px dashed #d7ccc8; padding: 12px; margin-bottom: 15px; font-size: 0.85rem; color: #5d4037; line-height: 1.5; border-radius: 12px; text-align: left; }
        .content-text { font-size: 0.9rem; line-height: 1.6; color: #4e342e; margin-bottom: 12px; }
        .desc-box { font-size: 0.95rem; line-height: 1.6; color: #4a148c; background: #fce4ec; padding: 15px; border-radius: 12px; border: 1px solid #f8bbd0; margin-top: 15px; }
        .point-title { font-size: 0.85rem; color: #8d243c; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
        .point-item { font-size: 0.88rem; color: #4e342e; margin-left: 5px; margin-bottom: 4px; position: relative; padding-left: 14px; }
        .point-item::before { content: "🍁"; position: absolute; left: -4px; font-size: 0.75rem; }
        .tip-box { font-size: 0.82rem; color: #5d4037; background: #fff8e1; border: 1px solid #ffe082; padding: 10px; border-radius: 10px; margin-top: 10px; line-height: 1.5; }
        
        .controls { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 15px; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .nav-btn { flex: 1; padding: 12px 5px; border: none; border-radius: 10px; background: #efebe9; font-weight: bold; cursor: pointer; color: #5d4037; font-size: 0.9rem; }
        .next-btn { background: #ffccbc; color: #4e342e; }
        
        .submit-btn { background: linear-gradient(135deg, #8d243c, #b71c1c); color: white; flex: 1.4; } 
        .home-btn { width: 100%; padding: 10px; background: #8d6e63; color: white; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div id="main-menu">
        <h1>🍁 10월 11일 순 공과</h1>
        <div class="subtitle">내려놓는 용기</div>
        <div class="verse-box">
            "다윗이 그의 머리 곁에서 창과 물병을 가지고 떠나가되 아무도 보거나 알지 못하며 깨어 있는 사람도 없었으니 이는 여호와께서 그들을 깊이 잠들게 하셨으므로 그들이 다 잠들어 있었기 때문이었더라" <br>(사무엘상 26:12)
        </div>
        <div class="menu-group">
            <button class="btn" onclick="startSlide()">📖 말씀 소그룹 나눔<br><small style="font-weight:normal; font-size:0.8rem; display:block; margin-top:5px;">순별 나눔 시작하기</small></button>
        </div>
    </div>

    <div id="slide-container">
        <div id="slides"></div>
        <div class="controls">
            <div class="nav-row">
                <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">이전</button>
                <span id="page-num" style="font-size: 0.8rem; color: #8d243c; min-width:40px; text-align:center; font-weight:bold;"></span>
                <button class="nav-btn next-btn" id="nextBtn" onclick="changeSlide(1)">다음</button>
                <button class="nav-btn submit-btn" id="submitBtn" onclick="finishSlide()">🎉 나눔 완료</button>
            </div>
            <button class="home-btn" onclick="goHome()">🏠 처음으로</button>
        </div>
    </div>
</div>

<script>
    let currentSlide = 0;

    const questions = [
        { 
            chapter: "Q1. 나눔 1", 
            title: "나를 조급하게 만드는 반복되는 억울함", 
            text: "다윗은 아무 잘못이 없음에도 사울 왕에게 끊임없이 쫓기며 깊은 피로감과 억울함을 느꼈습니다. 최근 나의 일상(직장, 학업, 관계, 취업 준비 등)에서 상황이 해결되지 않고 반복되어 나를 피곤하게 만들거나 조급하게 만드는 ‘억울한 상황’은 무엇인가요?",
            points: [
                "반복되는 상황 속에서 느끼는 답답함과 조급함을 진솔하게 나눕니다."
            ],
            tip: "💡 <b>진행 팁:</b> 청년들이 일상에서 느끼는 답답함과 조급함을 솔직하게 내어놓고, 서로의 상황에 깊이 공감하는 시간을 가집니다."
        },
        { 
            chapter: "Q2. 나눔 2", 
            title: "완벽해 보이는 기회와 영적 합리화", 
            text: "아비새는 사울이 무방비로 잠든 모습을 보고 ‘하나님이 주신 완벽한 기회’라며 다윗을 부추겼습니다. 혹시 나 역시 억울함을 풀고 싶거나 상황을 빠르게 끝내고 싶어서, 하나님의 뜻보다 내 생각과 계산을 우선시하며 ‘하나님이 이해해 주실 거야’라고 합리화했던 순간이 있었나요?",
            points: [
                "내 욕망이나 분노가 하나님의 말씀보다 앞서지 않았는지 스스로 점검합니다."
            ],
            tip: "💡 <b>진행 팁:</b> 내 눈에 보이는 완벽한 상황이 무조건 하나님의 뜻은 아닐 수 있음을 돌아보고, 내 욕망이나 분노가 하나님의 말씀보다 앞서지 않았는지 스스로 점검하도록 도와주세요."
        },
        { 
            chapter: "Q3. 나눔 3", 
            title: "내 손의 창을 내려놓는 용기", 
            text: "다윗은 사울을 내 손으로 단번에 심판할 수 있었지만, 사울의 창과 물병만 챙긴 채 심판을 하나님께 맡겼습니다. 이번 한 주간 내 힘으로 판을 뒤엎거나 상대방을 원망하려는 ‘내 손의 칼/창’을 내려놓고, 하나님의 다스리심을 믿으며 실천할 한 가지 구체적인 결단은 무엇인가요?",
            points: [
                "하나님의 주권을 인정하며 '내 손의 창'을 내려놓을 구체적 행동을 다짐합니다."
            ],
            tip: "💡 <b>진행 팁:</b><br>• 나를 힘들게 하는 사람을 향한 비난을 멈추고 기도로 토로하기<br>• 불안하다고 편법을 택하지 않고 정직하게 순종하기<br>• 답답할 때 시편 말씀(예: 시편 13편)을 묵상하며 감사의 고백 올리기"
        }
    ];

    function startSlide() {
        currentSlide = 0;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('slide-container').style.display = 'flex';
        renderSlide();
    }

    function renderSlide() {
        const slidesDiv = document.getElementById('slides');
        const q = questions[currentSlide];
        
        let contentHTML = `<div class="content-text">${q.text}</div>`;
        
        let descHTML = "";
        if (q.points) {
            descHTML = `<div class="desc-box">`;
            descHTML += `<div class="point-title">💡 나눔 핵심 포인트</div>`;
            q.points.forEach(point => {
                descHTML += `<div class="point-item">${point}</div>`;
            });
            descHTML += `</div>`;
        }

        let tipHTML = q.tip ? `<div class="tip-box">${q.tip}</div>` : "";

        slidesDiv.innerHTML = `
            <div style="animation: fadeIn 0.3s; display: flex; flex-direction: column; height: 100%;">
                <div class="slide-header">
                    <span class="slide-step">${q.chapter}</span>
                    <span class="slide-title">${q.title}</span>
                </div>
                <div style="flex-grow: 1; overflow-y: auto;">
                    ${contentHTML}
                    ${descHTML}
                    ${tipHTML}
                </div>
            </div>
        `;
        
        document.getElementById('page-num').innerText = `${currentSlide + 1}/${questions.length}`;
        document.getElementById('prevBtn').style.visibility = currentSlide === 0 ? 'hidden' : 'visible';
        
        if (currentSlide === questions.length - 1) {
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('submitBtn').style.display = 'none';
        }
    }

    function changeSlide(direction) {
        currentSlide += direction;
        if (currentSlide >= questions.length) currentSlide = questions.length - 1;
        if (currentSlide < 0) currentSlide = 0;
        renderSlide();
    }

    function finishSlide() {
        alert("오늘 순 공과 나눔을 모두 마쳤습니다. 내 손의 창과 칼을 내려놓고, 나를 마침내 이끄실 하나님의 주권을 온전히 신뢰하며 승리하는 한 주가 되기를 축복합니다. 함께 기도함으로 모임을 마무리해 주세요! 🍁");
        goHome();
    }

    function goHome() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('slide-container').style.display = 'none';
    }
</script>

</body>
</html>
