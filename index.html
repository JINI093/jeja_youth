<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제자교회 청년부 5월 17일 순 공과</title>
    <style>
        body {
            background-color: #fbe9e7;
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 1.8rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 85%;
            min-height: 540px;
            display: flex;
            flex-direction: column;
        }
        h1 { color: #d84315; font-size: 1.35rem; margin-bottom: 0.3rem; line-height: 1.4; }
        .subtitle { color: #ff7043; font-size: 0.95rem; margin-bottom: 1.2rem; font-weight: bold; }
        
        .menu-group { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; justify-content: center; }
        .btn {
            padding: 18px;
            border: none;
            border-radius: 12px;
            background-color: #fbe9e7;
            color: #bf360c;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
        }

        #slide-container { display: none; flex-direction: column; height: 100%; text-align: left; }
        #slides { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .slide-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; border-bottom: 2px solid #fbe9e7; padding-bottom: 10px; }
        .slide-step { background: #d84315; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; white-space: nowrap; }
        .slide-title { color: #d84315; font-size: 1.05rem; font-weight: bold; line-height: 1.4; }
        
        .quote-box { background: #fff8e1; border-left: 4px solid #ffb300; padding: 12px; margin-bottom: 15px; font-size: 0.88rem; color: #5d4037; line-height: 1.6; border-radius: 0 10px 10px 0; font-style: italic; }
        .verse-box { background: #fafafa; border: 1px dashed #ccc; padding: 12px; margin-bottom: 15px; font-size: 0.85rem; color: #666; line-height: 1.5; border-radius: 10px; }
        .content-text { font-size: 0.92rem; line-height: 1.7; color: #555; margin-bottom: 12px; }
        .desc-text { font-size: 1.05rem; font-weight: bold; color: #bf360c; background: #fff5f5; padding: 15px; border-radius: 10px; line-height: 1.6; border: 1px solid #ffcdd2; }
        
        .controls { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 15px; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .nav-btn { flex: 1; padding: 12px 5px; border: none; border-radius: 8px; background: #f5f5f5; font-weight: bold; cursor: pointer; color: #666; font-size: 0.9rem; }
        .next-btn { background: #ffccbc; color: #bf360c; }
        
        .submit-btn { background: #d84315; color: white; flex: 1.4; } 
        .home-btn { width: 100%; padding: 10px; background: #757575; color: white; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div id="main-menu">
        <h1>💞 5월 17일 순 공과</h1>
        <div class="subtitle">결혼과 연애 [환장인가 환상인가?]</div>
        <div class="verse-box">
            "여호와 하나님이 이르시되 사람이 혼자 사는 것이 좋지 못하니 내가 그를 위하여 돕는 배필을 지으리라 하시니라" (창 2:18)
        </div>
        <div class="menu-group">
            <button class="btn" onclick="startSlide()">📖 팀 켈러 『결혼을 말하다』<br><small style="font-weight:normal; font-size:0.8rem; display:block; margin-top:5px;">순별 나눔 시작하기</small></button>
        </div>
    </div>

    <div id="slide-container">
        <div id="slides"></div>
        <div class="controls">
            <div class="nav-row">
                <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">이전</button>
                <span id="page-num" style="font-size: 0.8rem; color: #888; min-width:40px; text-align:center;"></span>
                <button class="nav-btn next-btn" id="nextBtn" onclick="changeSlide(1)">다음</button>
                <button class="nav-btn submit-btn" id="submitBtn" onclick="finishSlide()">🎉 나눔 완료</button>
            </div>
            <button class="home-btn" onclick="goHome()">🏠 처음으로</button>
        </div>
    </div>
</div>

<script>
    let currentSlide = 0;

    const questions = [
        // 1장
        { chapter: "1장: 환상 깨기", title: "Q1. 내가 꿈꾸는 이상형", quote: "“배우자가 당신의 모든 결핍을 채워줄 것이라 기대하는 것은 그 사람을 하나님의 자리에 앉히는 우상숭배다.”", text: "외모, 경제력, 성격, 신앙, 가치관 등 솔직하게 가리지 않고 이야기해 봅시다.", desc: "내가 생각하는 ‘이상적인 배우자’의 조건 TOP 3는 무엇인가요?" },
        { chapter: "1장: 환상 깨기", title: "Q2. 조건의 본질 직면하기", quote: "“배우자가 당신의 모든 결핍을 채워줄 것이라 기대하는 것은 그 사람을 하나님의 자리에 앉히는 우상숭배다.”", text: "우리가 내세우는 수많은 조건 이면에는 내면의 연약함이 숨어있을 때가 많습니다.", desc: "솔직히 그 조건들은 나의 외로움, 결핍, 혹은 미래에 대한 불안을 채우기 위한 ‘나 중심적인 조건’은 아닌가요?" },
        { chapter: "1장: 환상 깨기", title: "Q3. 죄인과 죄인의 만남", quote: "“세상에 완벽하게 맞는 사람은 없다. 결혼은 두 명의 죄인이 만나는 것이다.”", text: "팀 켈러의 말에 동의하나요? 연애나 인간관계에서 마주하는 타인의 연약함을 떠올려 봅시다.", desc: "만약 상대방이 내가 정말 싫어하는 단점(죄성)을 적나라하게 드러낸다면 어떻게 대처할 것 같나요?" },
        
        // 2장
        { chapter: "2장: 돕는 배필", title: "Q4. 감정이 식어버릴 때", quote: "“사랑하기 때문에 결혼을 유지하는 것이 아니다. 결혼이라는 언약(약속)을 맺었기 때문에 사랑하는 것이다.”", text: "요즘 미디어나 세상이 말하는 대중적인 사랑은 늘 '뜨거운 감정'만을 가장 중요하게 여깁니다.", desc: "만약 결혼 후 연애 때의 뜨거운 감정이 식어버린다면, 그 관계를 유지할 수 있는 진짜 힘은 어디서 올까요?" },
        { chapter: "2장: 돕는 배필", title: "Q5. 언약이 있는 사랑", quote: "성경은 배우자를 ‘돕는 배필’(창 2:18)이라고 부릅니다. 이는 단순한 조력자가 아닌 생명을 거는 신실함을 뜻합니다.", desc: "내가 생각하는 진짜 ‘의리(언약) 있는 사랑’, 즉 상대방이 무너지거나 조건이 나빠졌을 때도 곁을 지키는 사랑이란 어떤 모습일까요?" },
        { chapter: "2장: 돕는 배필", title: "Q6. 약속의 사람 되기", quote: "하나님은 우리의 상태나 조건이 가장 나쁠 때에도 우리를 향한 언약(약속)을 신실하게 지키셨습니다.", desc: "내가 누군가에게 그런 ‘조건 없는 약속의 사람’이 되어주기 위해, 지금 나에게 가장 필요한 영적 훈련은 무엇일까요?" },
        
        // 3장
        { chapter: "3장: 영적 우정", title: "Q7. 지적과 도움 사이", quote: "“결혼의 목적은 배우자가 장차 하나님 안에서 변화될 영광스러운 새사람의 모습을 미리 보고, 그 과정에 기꺼이 조력자가 되는 것이다.”", text: "나를 가장 가깝고 잘 아는 연인이나 지인이 나의 연약함을 짚어낼 때를 돌아봅시다.", desc: "연약함이나 단점을 지적받을 때, 나는 그것을 기분 나쁜 ‘비난(간섭)’으로 듣나요, 아니면 나를 살리는 ‘도움(존중)’으로 받아들이나요?" },
        { chapter: "3장: 영적 우정", title: "Q8. 성화를 돕는 조력자", quote: "팀 켈러는 결혼을 ‘서로의 성화(예수님을 닮아감)를 돕는 최고의 우정’이라고 정의합니다.", desc: "만약 여러분이 연애나 결혼을 한다면, 상대방을 하나님께 더 가깝게 가도록 이끌어주는 ‘영적 조력자’가 될 자신이 있나요?" },
        { chapter: "3장: 영적 우정", title: "Q9. 나에게서 깎여야 할 부분", quote: "“11개월 된 아기가 부모를 힘들게 하면서도 부모를 철들게 하듯, 배우자도 내 이기심을 깎아내는 하나님의 도구입니다.”", text: "우리는 관계 속에서 나의 이기성과 마주하며 성숙해져 갑니다.", desc: "내 성격이나 성품 중, 연애와 결혼(또는 깊은 관계)을 통해 가장 많이 ‘깎여야 할 이기적인 부분’은 무엇이라고 생각하나요?" }
    ];

    function startSlide() {
        currentSlide = 0;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('slide-container').style.display = 'flex';
        renderSlide();
    }

    function renderSlide() {
        const slidesDiv = document.getElementById('slides');
        const q = questions[currentSlide];
        
        let quoteHTML = q.quote ? `<div class="quote-box">${q.quote}</div>` : "";
        let textHTML = q.text ? `<div class="content-text">${q.text}</div>` : "";

        slidesDiv.innerHTML = `
            <div style="animation: fadeIn 0.3s; display: flex; flex-direction: column; height: 100%;">
                <div class="slide-header">
                    <span class="slide-step">${q.chapter}</span>
                    <span class="slide-title">${q.title}</span>
                </div>
                <div style="flex-grow: 1; overflow-y: auto;">
                    ${quoteHTML}
                    ${textHTML}
                    <div class="desc-text">${q.desc}</div>
                </div>
            </div>
        `;
        
        document.getElementById('page-num').innerText = `${currentSlide + 1}/${questions.length}`;
        document.getElementById('prevBtn').style.visibility = currentSlide === 0 ? 'hidden' : 'visible';
        
        if (currentSlide === questions.length - 1) {
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('submitBtn').style.display = 'none';
        }
    }

    function changeSlide(direction) {
        currentSlide += direction;
        if (currentSlide >= questions.length) currentSlide = questions.length - 1;
        if (currentSlide < 0) currentSlide = 0;
        renderSlide();
    }

    function finishSlide() {
        alert("오늘 순 공과 나눔을 모두 마쳤습니다. 수고하셨습니다! 소그룹별로 자유롭게 기도로 마무리해 주세요. 🙏");
        goHome();
    }

    function goHome() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('slide-container').style.display = 'none';
    }
</script>

</body>
</html>
