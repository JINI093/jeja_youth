<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제자교회 청년부 5월 10일 순 공과</title>
    <style>
        body {
            background-color: #f1f8e9; /* 부드러운 연두색 (생명과 인도함) */
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 85%;
            min-height: 520px;
            display: flex;
            flex-direction: column;
        }
        h1 { color: #2e7d32; font-size: 1.4rem; margin-bottom: 0.5rem; line-height: 1.4; }
        .subtitle { color: #689f38; font-size: 1rem; margin-bottom: 1.5rem; font-weight: bold; }
        
        .menu-group { display: flex; flex-direction: column; gap: 15px; flex-grow: 1; justify-content: center; }
        .btn {
            padding: 20px;
            border: none;
            border-radius: 15px;
            background-color: #e8f5e9;
            color: #1b5e20;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        #slide-container { display: none; flex-direction: column; height: 100%; text-align: left; }
        #slides { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .slide-header { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid #e8f5e9; padding-bottom: 10px; }
        .slide-step { background: #2e7d32; color: white; padding: 3px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
        .slide-title { color: #2e7d32; font-size: 1.2rem; font-weight: bold; }
        
        .verse-box { background: #fff9c4; border: 1px dashed #fbc02d; padding: 15px; margin-bottom: 20px; font-size: 0.9rem; color: #5d4037; line-height: 1.6; border-radius: 12px; }
        .content-text { font-size: 1rem; line-height: 1.8; color: #333; margin-bottom: 15px; }
        .desc-text { font-size: 1.05rem; font-weight: bold; color: #1b5e20; background: #f1f8e9; padding: 15px; border-radius: 10px; line-height: 1.6; }
        
        .action-box { background: #e3f2fd; border-left: 4px solid #1e88e5; padding: 15px; border-radius: 0 10px 10px 0; margin-top: 10px; }
        .action-title { font-weight: bold; color: #1565c0; font-size: 0.9rem; margin-bottom: 5px; display: block; }

        .controls { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 20px; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .nav-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; background: #f5f5f5; font-weight: bold; cursor: pointer; color: #666; }
        .next-btn { background: #c8e6c9; color: #1b5e20; }
        .home-btn { width: 100%; padding: 12px; background: #2e7d32; color: white; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <!-- 메인 메뉴 -->
    <div id="main-menu">
        <h1>🌿 5월 10일 순 공과</h1>
        <div class="subtitle">사랑은 존중으로 드러난다</div>
        <div class="verse-box">
            "나는 너를 애굽 땅, 종 되었던 집에서 인도하여 낸 네 하나님 여호와니라. 너는 나 외에는 다른 신들을 네게 두지 말라" (출 20:2-3)
        </div>
        <div class="menu-group">
            <button class="btn" onclick="startSlide()">💬 나눔 질문 시작하기</button>
        </div>
    </div>

    <!-- 슬라이드 영역 -->
    <div id="slide-container">
        <div id="slides"></div>
        <div class="controls">
            <div class="nav-row">
                <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">이전</button>
                <span id="page-num" style="font-size: 0.9rem; color: #888;"></span>
                <button class="nav-btn next-btn" id="nextBtn" onclick="changeSlide(1)">다음</button>
            </div>
            <button class="home-btn" onclick="goHome()">🏠 처음으로</button>
        </div>
    </div>
</div>

<script>
    let currentSlide = 0;
    const questions = [
        {
            step: "Ice Breaking",
            title: "Q1. 절대 안 돼!",
            text: "어릴 적, 부모님이 \"절대 안 돼!\"라고 하셨던 것 중에 지금 생각하면 감사하거나 재미있는 기억이 있나요?",
            desc: "그때는 이해되지 않았지만, 시간이 지나 보호였음을 깨닫게 된 경험을 나누어 보세요."
        },
        {
            step: "Word",
            title: "Q2. 인도하여 낸 여호와",
            text: "하나님은 계명을 주시기 전, 자신을 '구원자'로 먼저 소개하셨습니다. 우리를 묶기 위해서가 아니라 살리기 위해 오신 분입니다.",
            desc: "하나님이 \"다른 신을 두지 말라\"고 하신 것이 우리를 '구속'하기 위함일까요, 아니면 '보호'하기 위함일까요?"
        },
        {
            step: "Word",
            title: "Q3. 위험한 장난감",
            text: "우리는 때로 하나님의 \"안 돼\"라는 음성을 무시하고 자꾸 손을 뻗게 되는 '우상'을 가지고 있을 때가 있습니다.",
            desc: "요즘 내가 하나님보다 더 의지하거나, 놓지 못하고 있는 나만의 '위험한 장난감'은 무엇인가요?"
        },
        {
            step: "Action",
            title: "Q4. 삶의 주인을 고백하기",
            text: "이번 주, 우리의 삶에서 하나님의 주인 되심을 구체적으로 선포하고 서로를 위해 기도하는 시간을 가집시다.",
            desc: "매일 아침 \"하나님, 오늘 제 인생의 주인은 하나님이십니다!\"라고 선포해 보세요.",
            isAction: true
        }
    ];

    function startSlide() {
        currentSlide = 0;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('slide-container').style.display = 'flex';
        renderSlide();
    }

    function renderSlide() {
        const slidesDiv = document.getElementById('slides');
        const q = questions[currentSlide];
        
        let actionHTML = q.isAction ? `
            <div class="action-box">
                <span class="action-title">🙏 함께 기도하기</span>
                <p style="font-size:0.85rem; color:#555; margin:0;">순원들이 각자 붙들고 있는 불안과 우상을 하나님 앞에 내려놓을 수 있도록 서로 손을 잡고 기도합시다.</p>
            </div>
        ` : "";

        slidesDiv.innerHTML = `
            <div style="animation: fadeIn 0.4s">
                <div class="slide-header">
                    <span class="slide-step">${q.step}</span>
                    <span class="slide-title">${q.title}</span>
                </div>
                <div class="content-text">${q.text}</div>
                <div class="desc-text">${q.desc}</div>
                ${actionHTML}
            </div>
        `;
        
        document.getElementById('page-num').innerText = `${currentSlide + 1} / ${questions.length}`;
        document.getElementById('prevBtn').style.visibility = currentSlide === 0 ? 'hidden' : 'visible';
        document.getElementById('nextBtn').innerText = currentSlide === questions.length - 1 ? '마침' : '다음';
    }

    function changeSlide(direction) {
        currentSlide += direction;
        if (currentSlide >= questions.length) goHome();
        else if (currentSlide < 0) currentSlide = 0;
        else renderSlide();
    }

    function goHome() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('slide-container').style.display = 'none';
    }
</script>

</body>
</html>
