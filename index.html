<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제자교회 청년부 7월 12일 순 공과</title>
    <style>
        body {
            background-color: #fbe9e7;
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 1.8rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 85%;
            min-height: 540px;
            display: flex;
            flex-direction: column;
        }
        h1 { color: #d84315; font-size: 1.35rem; margin-bottom: 0.3rem; line-height: 1.4; }
        .subtitle { color: #ff7043; font-size: 0.95rem; margin-bottom: 1.2rem; font-weight: bold; }
        
        .menu-group { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; justify-content: center; }
        .btn {
            padding: 18px;
            border: none;
            border-radius: 12px;
            background-color: #fbe9e7;
            color: #bf360c;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
        }

        #slide-container { display: none; flex-direction: column; height: 100%; text-align: left; }
        #slides { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .slide-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; border-bottom: 2px solid #fbe9e7; padding-bottom: 10px; }
        .slide-step { background: #d84315; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; white-space: nowrap; }
        .slide-title { color: #d84315; font-size: 1.05rem; font-weight: bold; line-height: 1.4; }
        
        .verse-box { background: #fafafa; border: 1px dashed #ccc; padding: 12px; margin-bottom: 15px; font-size: 0.85rem; color: #666; line-height: 1.5; border-radius: 10px; }
        .content-text { font-size: 0.95rem; line-height: 1.7; color: #444; margin-bottom: 12px; }
        .desc-box { font-size: 0.95rem; line-height: 1.6; color: #bf360c; background: #fff5f5; padding: 15px; border-radius: 10px; border: 1px solid #ffcdd2; margin-top: 15px; }
        .point-title { font-size: 0.85rem; color: #d84315; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
        .point-item { font-size: 0.88rem; color: #555; margin-left: 5px; margin-bottom: 4px; position: relative; padding-left: 10px; }
        .point-item::before { content: "•"; position: absolute; left: 0; color: #ff7043; }
        .choice-box { background: #fff8e1; border-left: 4px solid #ffb300; padding: 10px 12px; margin-top: 8px; font-size: 0.88rem; color: #5d4037; line-height: 1.5; border-radius: 0 8px 8px 0; }
        
        .controls { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 15px; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .nav-btn { flex: 1; padding: 12px 5px; border: none; border-radius: 8px; background: #f5f5f5; font-weight: bold; cursor: pointer; color: #666; font-size: 0.9rem; }
        .next-btn { background: #ffccbc; color: #bf360c; }
        
        .submit-btn { background: #d84315; color: white; flex: 1.4; } 
        .home-btn { width: 100%; padding: 10px; background: #757575; color: white; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div id="main-menu">
        <h1>👥 7월 12일 순 공과</h1>
        <div class="subtitle">무너뜨리시는 하나님, 순종하는 사람</div>
        <div class="verse-box">
            "이에 백성은 외치고 제사장들은 나팔을 불매 백성이 나팔 소리를 들을 때에 크게 소리 질러 외치니 성벽이 무너져 내린지라 백성이 각기 앞으로 나아가 그 성에 들어가서 그 성을 점령하고" <br>(여호수아 6:20)
        </div>
        <div class="menu-group">
            <button class="btn" onclick="startSlide()">📖 말씀 소그룹 나눔<br><small style="font-weight:normal; font-size:0.8rem; display:block; margin-top:5px;">순별 나눔 시작하기</small></button>
        </div>
    </div>

    <div id="slide-container">
        <div id="slides"></div>
        <div class="controls">
            <div class="nav-row">
                <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">이전</button>
                <span id="page-num" style="font-size: 0.8rem; color: #888; min-width:40px; text-align:center;"></span>
                <button class="nav-btn next-btn" id="nextBtn" onclick="changeSlide(1)">다음</button>
                <button class="nav-btn submit-btn" id="submitBtn" onclick="finishSlide()">🎉 나눔 완료</button>
            </div>
            <button class="home-btn" onclick="goHome()">🏠 처음으로</button>
        </div>
    </div>
</div>

<script>
    let currentSlide = 0;

    const questions = [
        { 
            chapter: "Q1. 분리된 삶의 고백", 
            title: "내 삶에서 '믿음'과 '현실'이 충돌하는 순간은?", 
            text: "설교 중 '시험 기간과 주일이 겹칠 때'의 고민처럼, 청년으로서 세상의 기준과 교회의 가치관이 부딪혀 괴로웠던 적이 많을 것입니다. 취업 준비, 이직, 직장 생활, 혹은 재정 관리 등 내 삶의 영역에서 \"믿음은 믿음이고, 현실은 현실이지\"라며 타협하고 싶어지거나 실제로 믿음을 유보했던 순간은 언제였는지 나누어 봅시다.",
            points: [
                "예배나 공동체 훈련 시간보다 학원, 자격증, 야근을 우선시해야만 안심이 되었던 경험",
                "세상 친구들의 성공 속도와 나의 영적 속도를 비교하며 불안해했던 마음",
                "믿음대로 살아가기엔 세상의 벽(여리고)이 너무 높고 단단하게 느껴졌던 순간"
            ]
        },
        { 
            chapter: "Q2. 영적 순종의 모험", 
            title: "미련해 보이는 '하나님의 이상한 작전'에 순종해 본 적이 있나요?", 
            text: "무기도 부족한 이스라엘이 여리고성 주위를 묵묵히 도는 것은 세상이 볼 때 참 바보 같고 위험한 행동이었습니다. 하지만 그들은 하나님을 신뢰함으로 그 '이상한 작전'에 순종했습니다. 남들은 스펙을 쌓고 인맥을 넓힐 때, 나는 오히려 '예배의 자리, 말씀 묵상, 공동체 섬김, 기도의 자리'를 선택함으로 경험했던 영적 은혜나 무너짐의 기적이 있었다면 나누어 봅시다.",
            points: [
                "바쁜 일정 속에서도 큐티와 기도를 타협하지 않았을 때 찾아왔던 마음의 평안과 환경의 열림",
                "주일에 학원 대신 예배를 선택했을 때 하나님이 채워주신 놀라운 채우심의 간증",
                "당장 눈앞의 변화가 보이지 않는 '6일 동안의 행진' 같았지만, 끝까지 인내하며 기도의 자리를 지켜냈던 경험"
            ]
        },
        { 
            chapter: "Q3. 전략 수정과 결단", 
            title: "세상에서 승리하기 위해 회복해야 할 '영적 루틴'은?", 
            text: "세상에서 성공하기 위해 남들보다 더 빨리 달리고 힘을 기르려 했던 나의 '인생 전략'을 이제는 '하나님이 앞서가시게 하는 전략'으로 수정해야 합니다. 매일 무의미하게 반복되는 것 같지만 결국 여리고를 무너뜨리는 강력한 무기가 될, 내가 이번 주에 반드시 사수할 '영적 행진(루틴) 한 가지'를 결단하고 서로를 위해 기도합시다.",
            choices: [
                "🌅 <b>아침의 행진:</b> 출근 혹은 등교 전 10분 동안 말씀을 읽고 \"오늘도 주님이 내 앞서 행하신다\"고 선포하며 시작하기",
                "⏸️ <b>거룩한 멈춤:</b> 하루 중 가장 불안하고 스트레스가 밀려오는 오후 시간에 3분간 눈을 감고 소리 내어 기도하기",
                "🗣️ <b>공동체의 함성:</b> 이번 주 주일 예배와 순모임 자리를 절대 타협하지 않고, 순원들과 함께 기도의 제목을 뜨겁게 공유하기"
            ]
        }
    ];

    function startSlide() {
        currentSlide = 0;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('slide-container').style.display = 'flex';
        renderSlide();
    }

    function renderSlide() {
        const slidesDiv = document.getElementById('slides');
        const q = questions[currentSlide];
        
        let contentHTML = `<div class="content-text">${q.text}</div>`;
        
        let descHTML = "";
        if (q.points) {
            descHTML = `<div class="desc-box">`;
            descHTML += `<div class="point-title">🔍 나눔 포인트</div>`;
            q.points.forEach(point => {
                descHTML += `<div class="point-item">${point}</div>`;
            });
            descHTML += `</div>`;
        } else if (q.choices) {
            descHTML = `<div style="margin-top: 15px;">`;
            q.choices.forEach(choice => {
                descHTML += `<div class="choice-box">${choice}</div>`;
            });
            descHTML += `</div>`;
        }

        slidesDiv.innerHTML = `
            <div style="animation: fadeIn 0.3s; display: flex; flex-direction: column; height: 100%;">
                <div class="slide-header">
                    <span class="slide-step">${q.chapter}</span>
                    <span class="slide-title">${q.title}</span>
                </div>
                <div style="flex-grow: 1; overflow-y: auto;">
                    ${contentHTML}
                    ${descHTML}
                </div>
            </div>
        `;
        
        document.getElementById('page-num').innerText = `${currentSlide + 1}/${questions.length}`;
        document.getElementById('prevBtn').style.visibility = currentSlide === 0 ? 'hidden' : 'visible';
        
        if (currentSlide === questions.length - 1) {
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('submitBtn').style.display = 'none';
        }
    }

    function changeSlide(direction) {
        currentSlide += direction;
        if (currentSlide >= questions.length) currentSlide = questions.length - 1;
        if (currentSlide < 0) currentSlide = 0;
        renderSlide();
    }

    function finishSlide() {
        alert("오늘 순 공과 나눔을 모두 마쳤습니다. 굳게 닫힌 여리고 성 앞에서도 내 계산 대신 하나님의 말씀에 묵묵히 순종하며 행진하는 신실한 청년들이 되기를 소망합니다. 함께 기도함으로 모임을 마무리해 주세요! 🙏");
        goHome();
    }

    function goHome() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('slide-container').style.display = 'none';
    }
</script>

</body>
</html>
